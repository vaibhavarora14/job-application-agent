name: Jobs liveness sweep

# Manually drain the published-jobs liveness backlog (or re-check) by calling the
# telemetry admin endpoint in bounded batches until hasMore is false.
on:
  workflow_dispatch:
    inputs:
      batch_limit:
        description: Jobs to check per admin call (1–100)
        required: false
        default: "50"
      max_rounds:
        description: Safety cap on admin calls (1626/50 ≈ 33)
        required: false
        default: "40"

permissions:
  contents: read

jobs:
  sweep:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    environment: telemetry-production
    steps:
      - name: Run batched liveness sweep until backlog is clear
        env:
          TELEMETRY_PRODUCTION_URL: https://job-application-agent-telemetry.varora1406.workers.dev
          TELEMETRY_SIGNING_SECRET: ${{ secrets.TELEMETRY_SIGNING_SECRET }}
          BATCH_LIMIT: ${{ github.event.inputs.batch_limit }}
          MAX_ROUNDS: ${{ github.event.inputs.max_rounds }}
        run: |
          set -euo pipefail
          limit="${BATCH_LIMIT:-50}"
          max_rounds="${MAX_ROUNDS:-40}"
          if ! [[ "$limit" =~ ^[0-9]+$ ]] || (( limit < 1 || limit > 100 )); then
            echo "batch_limit must be 1–100" >&2
            exit 1
          fi
          if ! [[ "$max_rounds" =~ ^[0-9]+$ ]] || (( max_rounds < 1 || max_rounds > 200 )); then
            echo "max_rounds must be 1–200" >&2
            exit 1
          fi
          total_checked=0
          total_open=0
          total_closed=0
          total_unknown=0
          for (( round=1; round<=max_rounds; round++ )); do
            echo "=== Round $round (limit=$limit) ==="
            body="$(curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${TELEMETRY_SIGNING_SECRET}" \
              -H "Content-Type: application/json" \
              -d "{\"limit\":${limit}}" \
              "${TELEMETRY_PRODUCTION_URL}/v1/admin/jobs/liveness-sweep")"
            echo "$body"
            checked="$(node -e 'const j=JSON.parse(process.argv[1]); if(!j.ok) process.exit(2); process.stdout.write(String(j.checked??0))' "$body")"
            open="$(node -e 'const j=JSON.parse(process.argv[1]); process.stdout.write(String(j.open??0))' "$body")"
            closed="$(node -e 'const j=JSON.parse(process.argv[1]); process.stdout.write(String(j.closed??0))' "$body")"
            unknown="$(node -e 'const j=JSON.parse(process.argv[1]); process.stdout.write(String(j.unknown??0))' "$body")"
            has_more="$(node -e 'const j=JSON.parse(process.argv[1]); process.stdout.write(j.hasMore?"1":"0")' "$body")"
            total_checked=$((total_checked + checked))
            total_open=$((total_open + open))
            total_closed=$((total_closed + closed))
            total_unknown=$((total_unknown + unknown))
            if [[ "$has_more" != "1" || "$checked" == "0" ]]; then
              echo "Backlog cleared (or empty batch)."
              break
            fi
            sleep 2
          done
          echo "Totals: checked=$total_checked open=$total_open closed=$total_closed unknown=$total_unknown"
          meta="$(curl --fail --silent --show-error "${TELEMETRY_PRODUCTION_URL}/v1/jobs/live?limit=1")"
          echo "Live meta: $meta"
          node -e '
            const j = JSON.parse(process.argv[1]);
            const newest = j.meta?.newestLastCheckedAt;
            if (!newest) {
              console.error("newestLastCheckedAt missing after sweep");
              process.exit(1);
            }
            const ageMs = Date.now() - Date.parse(newest);
            console.log("newestLastCheckedAt=", newest, "ageHours=", (ageMs/3600000).toFixed(2));
            if (!Number.isFinite(ageMs) || ageMs > 26 * 3600000) {
              console.error("newest check older than 26h");
              process.exit(1);
            }
          ' "$meta"
