name: Test telemetry staging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: telemetry-staging

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check && npm test && npm run privacy-audit
      - name: Apply aggregate database migrations
        run: npx --yes wrangler@4.122.0 d1 migrations apply job-application-agent-public-stats-staging --remote --config telemetry-worker/wrangler.jsonc --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy staging Worker
        run: |
          node -e 'process.stdout.write(JSON.stringify({SIGNING_SECRET: process.env.SIGNING_SECRET, POSTHOG_PROJECT_TOKEN: process.env.POSTHOG_PROJECT_TOKEN}))' \
            | npx --yes wrangler@4.122.0 secret bulk --config telemetry-worker/wrangler.jsonc --env staging
          npx --yes wrangler@4.122.0 deploy --config telemetry-worker/wrangler.jsonc --env staging --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SIGNING_SECRET: ${{ secrets.TELEMETRY_STAGING_SIGNING_SECRET }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_STAGING_PROJECT_TOKEN }}
      - name: Run pending-source staging contract
        id: pending_source
        run: node telemetry-worker/tests/e2e-staging.mjs
        env:
          TELEMETRY_STAGING_URL: https://job-application-agent-telemetry-staging.varora1406.workers.dev
      - name: Approve staging source through owner-only D1 moderation
        id: approve_source
        run: |
          source_id='${{ steps.pending_source.outputs.community_source_id }}'
          [[ "$source_id" =~ ^community-[0-9a-f]{16}$ ]]
          npx --yes wrangler@4.122.0 d1 execute job-application-agent-public-stats-staging --remote --config telemetry-worker/wrangler.jsonc --env staging --command "UPDATE community_sources SET publication_status = 'published', review_status = 'maintainer-reviewed', published_at = COALESCE(published_at, strftime('%Y-%m-%dT%H:%M:%fZ', 'now')), reviewed_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now'), updated_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now') WHERE source_id = '$source_id' AND publication_status = 'pending';"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify reviewed source is public
        id: verify_reviewed
        run: node telemetry-worker/tests/e2e-staging.mjs
        env:
          TELEMETRY_STAGING_URL: https://job-application-agent-telemetry-staging.varora1406.workers.dev
          STAGING_EXPECT_SOURCE_ID: ${{ steps.pending_source.outputs.community_source_id }}
      - name: Reject staging source through owner-only D1 moderation
        id: reject_source
        if: ${{ always() && steps.pending_source.outputs.community_source_id != '' }}
        run: |
          source_id='${{ steps.pending_source.outputs.community_source_id }}'
          [[ "$source_id" =~ ^community-[0-9a-f]{16}$ ]]
          npx --yes wrangler@4.122.0 d1 execute job-application-agent-public-stats-staging --remote --config telemetry-worker/wrangler.jsonc --env staging --command "UPDATE community_sources SET publication_status = 'rejected', review_status = 'maintainer-reviewed', rejected_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now'), reviewed_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now'), updated_at = strftime('%Y-%m-%dT%H:%M:%fZ', 'now') WHERE source_id = '$source_id';"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify rejected source stays private
        if: ${{ steps.pending_source.outcome == 'success' && steps.approve_source.outcome == 'success' && steps.verify_reviewed.outcome == 'success' && steps.reject_source.outcome == 'success' }}
        run: node telemetry-worker/tests/e2e-staging.mjs
        env:
          TELEMETRY_STAGING_URL: https://job-application-agent-telemetry-staging.varora1406.workers.dev
          STAGING_EXPECT_SOURCE_ID: ${{ steps.pending_source.outputs.community_source_id }}
          STAGING_EXPECT_REJECTED: 'true'
