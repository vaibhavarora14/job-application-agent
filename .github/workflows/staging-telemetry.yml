name: Test telemetry staging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: telemetry-staging

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check && npm test && npm run privacy-audit
      - name: Apply aggregate database migrations
        run: npx --yes wrangler@4.122.0 d1 migrations apply job-application-agent-public-stats-staging --remote --config telemetry-worker/wrangler.jsonc --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy staging Worker
        run: |
          node -e 'process.stdout.write(JSON.stringify({SIGNING_SECRET: process.env.SIGNING_SECRET, POSTHOG_PROJECT_TOKEN: process.env.POSTHOG_PROJECT_TOKEN}))' \
            | npx --yes wrangler@4.122.0 secret bulk --config telemetry-worker/wrangler.jsonc --env staging
          npx --yes wrangler@4.122.0 deploy --config telemetry-worker/wrangler.jsonc --env staging --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SIGNING_SECRET: ${{ secrets.TELEMETRY_STAGING_SIGNING_SECRET }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_STAGING_PROJECT_TOKEN }}
      - name: Run staging contract test
        run: node telemetry-worker/tests/e2e-staging.mjs
        env:
          TELEMETRY_STAGING_URL: https://job-application-agent-telemetry-staging.varora1406.workers.dev
