name: Refund overdue founding purchases

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refund:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    environment: site-production
    steps:
      - name: Request idempotent overdue refunds
        run: >-
          curl --fail --silent --show-error
          --request POST
          --header "Authorization: Bearer $REFUND_CRON_SECRET"
          https://jobappagent.com/api/internal/refunds
        env:
          REFUND_CRON_SECRET: ${{ secrets.REFUND_CRON_SECRET }}
