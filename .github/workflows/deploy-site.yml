name: Deploy landing site

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'job-application-agent/platforms.json'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: site-production

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci && npm --prefix site ci
      - name: Fail if job location metadata is past the 30-day cutoff
        # Past the cutoff the site silently drops location, workplace and pay for every
        # job (LOCATION_RECORD_MAX_AGE_MS). Refresh: node site/scripts/collect-job-locations.mjs
        run: node site/scripts/check-job-locations-freshness.mjs --max-days=30
      - name: Run site tests
        # site/package.json "test" runs `vinext build` first; dist/ is gitignored
        # and must never be taken from the checkout.
        run: npm --prefix site test
      - name: Run site lint and typecheck
        run: npm --prefix site run lint && npm --prefix site run typecheck
      - name: Build site for deploy
        # Fresh vinext build for wrangler (main/assets under site/dist/). Regenerates
        # vinext-server.json prerenderSecret; do not deploy committed artifacts.
        run: npm --prefix site run build
      - name: Reject accidental committed site build output
        run: |
          tracked="$(git ls-files 'site/dist' 'site/dist/**')"
          if [[ -n "$tracked" ]]; then
            echo 'site/dist/ is tracked in git; remove it with git rm --cached and keep it gitignored.' >&2
            printf '%s\n' "$tracked" >&2
            exit 1
          fi
      - name: Deploy Worker
        # Stamp Sentry release with the commit SHA. Source maps for Workers are
        # out of scope for P0 — release tagging alone is enough to group issues.
        run: >
          npx --yes wrangler@4.130.0 deploy
          --config site/wrangler.jsonc
          --keep-vars
          --var "SENTRY_RELEASE:${GITHUB_SHA}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SHA: ${{ github.sha }}
      - name: Verify site deployment
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 --retry-max-time 30 "$SITE_WORKER_URL/api/health"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 --retry-max-time 30 "$SITE_WORKER_URL/api/community-stats"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 --retry-max-time 30 "$SITE_WORKER_URL/api/community-jobs?limit=1"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 --retry-max-time 30 "$SITE_WORKER_URL/api/community-jobs-live?limit=1"
          jobs_html="$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 --retry-max-time 30 "$SITE_WORKER_URL/jobs")"
          printf '%s' "$jobs_html" | grep -Fq 'Open roles, reviewed'
          printf '%s' "$jobs_html" | grep -Fq 'jobappagent.com/jobs'
          # Whole-page: /jobs must not surface founding pricing (header included).
          ! printf '%s' "$jobs_html" | grep -Eiq 'Reserve for \$49|Founding reservation|noindex'
          sitemap_xml="$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 --retry-max-time 30 "$SITE_WORKER_URL/sitemap.xml")"
          printf '%s' "$sitemap_xml" | grep -Fq 'https://jobappagent.com/jobs'
          community_html="$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 --retry-max-time 30 "$SITE_WORKER_URL/community-view")"
          home_html="$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 --retry-max-time 30 "$SITE_WORKER_URL/")"
          # Post-#98 founding-reservation CTA (community-view nav + homepage offer).
          printf '%s' "$community_html" | grep -Fq 'Reserve for $49'
          printf '%s' "$home_html" | grep -Fq 'Founding reservation · $49'
          printf '%s' "$home_html" | grep -Fq 'Reserve for $49'
          printf '%s' "$home_html" | grep -Fq 'Reserve founding access'
          printf '%s' "$home_html" | grep -Fq 'Founding reservation open'
          printf '%s' "$home_html" | grep -Fq 'COMING SOON'
          printf '%s' "$home_html" | grep -Fq 'Cloud access'
          printf '%s' "$home_html" | grep -Fq 'Smarter agent on cloud.'
          # Reject stale dual Hosted/Cloud peer framing and activate / 90-day / open-hosted copy.
          ! printf '%s' "$community_html$home_html" | grep -Eiq 'Activate founding access|Reserve 90-day access|WINDOW OPEN|HOSTED OPEN|VERIFYING|Hosted \+ cloud sequence|Hosted continuity'
        env:
          SITE_WORKER_URL: https://job-application-agent-site.varora1406.workers.dev
      - name: Alert if jobs liveness is stale (>26h)
        # Soft-fail visibility on deploy: exits non-zero so the deploy job fails when
        # the newest published lastCheckedAt is missing or older than 26 hours.
        env:
          TELEMETRY_PRODUCTION_URL: https://job-application-agent-telemetry.varora1406.workers.dev
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            "$TELEMETRY_PRODUCTION_URL/v1/jobs/live?limit=1")"
          node -e '
            const maxAgeMs = 26 * 60 * 60 * 1000;
            const j = JSON.parse(process.argv[1]);
            const newest = j?.meta?.newestLastCheckedAt ?? null;
            if (newest == null) {
              console.error("FAIL: meta.newestLastCheckedAt is null — run Jobs liveness sweep.");
              process.exit(1);
            }
            const ageMs = Date.now() - Date.parse(newest);
            console.log(JSON.stringify({ newestLastCheckedAt: newest, ageHours: +(ageMs / 3600000).toFixed(3) }));
            if (!Number.isFinite(ageMs) || ageMs > maxAgeMs) {
              console.error("FAIL: newest lastCheckedAt is older than 26 hours.");
              process.exit(1);
            }
          ' "$body"
