name: Deploy private state Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: private-state-production

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run privacy-audit && npm run smoke:package && npm run check:native-artifacts
      - name: Apply private-state database migrations
        run: npx --yes wrangler@4.130.0 d1 migrations apply job-application-agent-private-state --remote --config state-worker/wrangler.jsonc --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy private-state Worker
        run: npx --yes wrangler@4.130.0 deploy --config state-worker/wrangler.jsonc --env="" --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify public liveness only
        run: curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 --retry-max-time 30 "$PRIVATE_STATE_URL/healthz"
        env:
          PRIVATE_STATE_URL: https://job-application-agent-state.varora1406.workers.dev
